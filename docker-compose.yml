services:
  model-download:
    build: .
    command: ["python", "-m", "reazonspeech_server.download_models"]
    environment:
      MODEL_PRECISION: ${MODEL_PRECISION:-int8}
      HF_HOME: /models
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./models:/models
    restart: "no"
  reazonspeech-server:
    build: .
    depends_on:
      model-download:
        condition: service_completed_successfully
    ports:
      - "${STT_BIND_ADDRESS:-127.0.0.1}:${STT_PORT:-9090}:9090"
    environment:
      HOST: 0.0.0.0
      PORT: 9090
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.5}
      VAD_MIN_SPEECH_MS: ${VAD_MIN_SPEECH_MS:-250}
      VAD_MIN_SILENCE_MS: ${VAD_MIN_SILENCE_MS:-500}
      VAD_MAX_SPEECH_SECONDS: ${VAD_MAX_SPEECH_SECONDS:-30}
      MODEL_PRECISION: ${MODEL_PRECISION:-int8}
      NUM_THREADS: ${NUM_THREADS:-2}
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
